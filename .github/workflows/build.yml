name: Windows build and tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build .\src\NetworkProfiles\NetworkProfiles.csproj -c Release
      - name: Test
        run: dotnet test .\tests\NetworkProfiles.Tests\NetworkProfiles.Tests.csproj -c Release