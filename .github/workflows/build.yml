name: Windows build and tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build .\src\NetworkProfiles\NetworkProfiles.csproj -c Release
      - name: Test
        run: dotnet test .\tests\NetworkProfiles.Tests\NetworkProfiles.Tests.csproj -c Release
      - name: Publish portable single-file EXE
        run: dotnet publish .\src\NetworkProfiles\NetworkProfiles.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o .\artifacts\publish
      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: NetworkProfiles-win-x64
          path: artifacts/publish/
          if-no-files-found: error